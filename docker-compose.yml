services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sensor
      POSTGRES_PASSWORD: sensor
      POSTGRES_DB: sensors
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.2
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.7.2
    depends_on: [zookeeper]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  airflow:
    build:
      context: .
      dockerfile: airflow/Dockerfile
    depends_on: [postgres, kafka]
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://sensor:sensor@postgres:5432/sensors
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: dev-secret
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl
      - ./sql:/opt/airflow/sql
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username airflow --password airflow
      --firstname Demo --lastname User --role Admin
      --email airflow@example.com || true;
      airflow scheduler & airflow webserver"

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    depends_on: [kafka]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    command: python producer.py --events 10000 --interval 0.01

volumes:
  pgdata:
